<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Complete | Dalziel Computing</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:#eaf4ff;font:16px/1.5 system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 20%,#fff8 1px,transparent 2px),radial-gradient(circle at 70% 65%,#8bdfff88 1px,transparent 2px),radial-gradient(ellipse at top,#20345b,transparent 65%);background-size:113px 127px,173px 151px,100% 100%}main{max-width:760px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;color:#a5bddb}article{background:#101c32f5;border:1px solid #344b69;border-radius:22px;padding:clamp(20px,5vw,42px);box-shadow:0 20px 70px #0006;margin-top:22px}h1{font-size:clamp(30px,6vw,54px);line-height:1.05;margin:12px 0;color:#83e9f5;letter-spacing:-1px}h2{line-height:1.25;font-size:25px}p{color:#b9cbe2}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #416080;background:#1a304b;color:#fff;border-radius:12px;padding:13px 18px;text-align:left}button:hover,button:focus-visible{border-color:#83e9f5;background:#254663}button.primary{background:#83e9f5;color:#08182a;font-weight:800;border:0;text-align:center}button:disabled{opacity:.4;cursor:not-allowed}input[type=text],textarea{width:100%;padding:13px;border:1px solid #416080;border-radius:10px;background:#091426;color:white}label{display:block;margin:12px 0 6px}.choices{display:grid;gap:10px;margin:22px 0}.selected{border:2px solid #83e9f5;background:#23485d}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.tag{color:#83e9f5;font-size:12px;letter-spacing:2px;font-weight:800}.track{height:7px;background:#263a54;border-radius:8px;margin-top:16px;overflow:hidden}.bar{height:100%;background:#83e9f5;transition:width .2s}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#1a304b;padding:18px;border-radius:12px}.tile strong{display:block;font-size:34px;color:#83e9f5}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px}.checks label{background:#192b43;padding:10px;border-radius:8px;margin:0}input[type=checkbox]{accent-color:#83e9f5}.confidence{display:flex;flex-wrap:wrap;gap:8px}.rocket{font-size:62px;text-align:center}small{color:#a5bddb}footer{text-align:center;color:#a5bddb;font-size:12px;margin-top:20px}li{margin:7px 0}pre{white-space:pre-wrap;background:#081426;padding:14px;border-radius:8px;color:#c9f5ff}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #83e9f5;outline-offset:3px}@media print{body,article{background:white;color:black}p,small,.tag,h1,.tile strong{color:black}.tile{background:#eee}button,header,footer,.track{display:none}}
</style><main><header><span>DALZIEL COMPUTING</span><span>FLIGHT CONTROL / 02</span></header><div class="track" role="progressbar" aria-label="Mission progress"><div class="bar" id="bar"></div></div><article id="app"></article><footer>SPACE SHOOTER • FINAL DEVELOPER ASSESSMENT</footer></main><script>
const questions=[
['Which event detects when two sprites touch?',['On game update','On sprite overlap','On button pressed','On start'],1],
['What happens when the player collides with an enemy?',['The player gains a point','The countdown restarts','The player loses one life','The player fires a projectile'],2],
['Why automatically destroy enemies that leave the screen?',['To remove sprites that are no longer needed','To increase the player’s score','To change the background','To restart the game'],0],
['In the original completed game, what happens when a projectile overlaps an enemy?',['The player loses a life','The enemy moves faster','The game ends','The enemy is destroyed and the score increases'],3],
['The player gains a life when hitting an enemy. Which change fixes this?',['Change score by −1','Change life by −1','Change life by 1','Set life to 6'],1,'on Player overlaps Enemy\n    destroy otherSprite\n    change life by 1'],
['Enemies disappear when hit, but the score never increases. Which instruction is missing?',['Start countdown 30','Change life by 1','Change score by 1','Set enemy velocity to −100'],2,'on Projectile overlaps Enemy\n    destroy otherSprite\n    [missing instruction]'],
['The game ends after three seconds instead of 30. What should you change?',['Start countdown to 30 seconds','Enemy interval to 30 milliseconds','Starting lives to 30','Player speed to 30'],0,'on start\n    set life to 6\n    start countdown 3 (s)']];
const upgrades=['Sound effects','Visual effects','Sprite design','Game difficulty','Faster enemies','Bonus points','Game instructions','Projectile improvements','Extra-life power-up','Secondary weapon','Increasing difficulty','Victory condition','Boss battle'];let name='',step=-1,answers=Array(7).fill(-1),done=new Set(),confidence=0,goal='';const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.querySelector('#bar').style.width=(step<0?0:step>=8?100:(step+1)/9*100)+'%';if(step<0){app.innerHTML=`<div class="rocket">🚀</div><div class="tag">FINAL DEVELOPER ASSESSMENT</div><h1>MISSION<br>COMPLETE</h1><p>Your game is built. Now prove your skills as a developer.</p><div class="tiles"><div class="tile">7 scored questions</div><div class="tile">About 5 minutes</div></div><form id="start"><label for="name">Developer name</label><input id="name" type="text" required maxlength="60" autocomplete="off" placeholder="Enter your name" value="${esc(name)}"><div class="nav"><button class="primary" type="submit">Launch mission →</button></div></form>`;document.querySelector('#start').onsubmit=e=>{e.preventDefault();name=document.querySelector('#name').value.trim();if(name){step=0;render()}};return}if(step<7){let q=questions[step];app.innerHTML=`<div class="tag">STAGE ${step<4?'01 / KNOWLEDGE CHECK':'02 / DEBUGGING CHALLENGE'}</div><p>Question ${step+1} of 7</p><h2>${q[0]}</h2>${q[3]?`<pre>${esc(q[3])}</pre>`:''}<div class="choices">${q[1].map((a,i)=>`<button aria-pressed="${answers[step]===i}" class="${answers[step]===i?'selected':''}" onclick="choose(${i})">${'ABCD'[i]}. ${a}</button>`).join('')}</div><div class="nav"><button onclick="back()">← Back</button><button class="primary" ${answers[step]<0?'disabled':''} onclick="next()">Continue →</button></div>`;return}if(step===7){app.innerHTML=`<div class="tag">STAGE 03 / DEVELOPER REFLECTION</div><h2>Review your mission</h2><p>These answers do not affect your quiz score.</p><label>Which upgrades did you successfully complete? (Select all that apply, or leave blank.)</label><div class="checks">${upgrades.map((u,i)=>`<label><input type="checkbox" ${done.has(i)?'checked':''} onchange="toggle(${i},this.checked)"> ${u}</label>`).join('')}</div><label>How confident are you that you could independently modify another MakeCode game?</label><div class="confidence">${[1,2,3,4,5].map(i=>`<button aria-pressed="${confidence===i}" class="${confidence===i?'selected':''}" onclick="setConfidence(${i})">${i}</button>`).join('')}</div><small>1 = Not yet confident · 5 = Very confident</small><label for="goal">What would you add if you had another lesson?</label><textarea id="goal" rows="3" maxlength="400" oninput="goal=this.value;validate()" placeholder="My next development goal…">${esc(goal)}</textarea><div class="nav"><button onclick="back()">← Back</button><button id="finish" class="primary" onclick="next()">Complete mission →</button></div>`;validate();return}let k=answers.slice(0,4).filter((a,i)=>a===questions[i][2]).length,d=answers.slice(4).filter((a,i)=>a===questions[i+4][2]).length;app.innerHTML=`<div class="tag">MISSION REPORT / ASSESSMENT COMPLETE</div><h1>${k+d===7?'Mission successful!':'Mission complete!'}</h1><p>Developer: <strong>${esc(name)}</strong></p><div class="tiles"><div class="tile">Knowledge<strong>${k}/4</strong></div><div class="tile">Debugging<strong>${d}/3</strong></div></div><h2>Total score: ${k+d}/7</h2><p>${k+d===7?'All questions correct. Excellent work!':'Review questions '+answers.map((a,i)=>a!==questions[i][2]?i+1:null).filter(Boolean).join(', ')+'. You can retry to improve your score.'}</p><h3>Upgrades completed</h3><p>${done.size?[...done].sort((a,b)=>a-b).map(i=>'✓ '+upgrades[i]).join('<br>'):'No additional upgrades reported.'}</p><h3>Developer confidence: ${confidence}/5</h3><h3>Next development goal</h3><p>${esc(goal)}</p><div class="choices"><button class="primary" onclick="copyReport()">Copy report for Teams</button><button onclick="retry()">Retry assessment</button><button onclick="resetMission()">Start a new mission</button></div><small id="status" role="status">Copy your report and paste it into Teams if your teacher asks. Nothing is submitted automatically.</small>`}function choose(i){answers[step]=i;render()}function back(){step--;render()}function next(){step++;render();window.scrollTo(0,0)}function toggle(i,b){b?done.add(i):done.delete(i)}function setConfidence(i){confidence=i;render()}function validate(){document.querySelector('#finish').disabled=!confidence||!goal.trim()}function retry(){answers.fill(-1);step=0;render()}function resetMission(){name='';answers.fill(-1);done.clear();confidence=0;goal='';step=-1;render()}async function copyReport(){let k=answers.slice(0,4).filter((a,i)=>a===questions[i][2]).length,d=answers.slice(4).filter((a,i)=>a===questions[i+4][2]).length;let report=`MISSION COMPLETE\nDeveloper: ${name}\nKnowledge: ${k}/4\nDebugging: ${d}/3\nTotal: ${k+d}/7\nUpgrades: ${[...done].map(i=>upgrades[i]).join(', ')||'None reported'}\nConfidence: ${confidence}/5\nNext goal: ${goal}`;try{await navigator.clipboard.writeText(report);document.querySelector('#status').textContent='Report copied. Paste it into Teams.'}catch{let t=document.createElement('textarea');t.value=report;app.append(t);t.select();document.querySelector('#status').textContent='Select and copy the report below manually.'}}render();</script></html>
